[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrobotsoul"
version = "0.1.0"
description = "A safe, profile-driven robot agent runtime MVP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
robotsoul = "robotsoul.cli:main"
robotsoul-build = "robotsoul.build:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["robotsoul*", "adapters*"]
exclude = ["tests*", "third_party*"]

[tool.setuptools.package-data]
adapters = ["*/module.json", "*/profiles/*.json", "*/third_party/README.md"]
robotsoul = ["web/*.html", "web/*.css", "web/*.js", "data/*.json"]
