[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrobotsoul"
version = "0.1.0"
description = "A safe, profile-driven robot agent runtime MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = [
  "aiortc==1.16.0",
  "av==16.1.0",
  "numpy>=1.24,<3",
  "pypinyin==0.55.0",
  "sherpa-onnx==2.0.1",
  "sentencepiece==0.2.1",
  "sounddevice==0.5.2",
]

[project.scripts]
robotsoul = "robotsoul.cli:main"
robotsoul-build = "robotsoul.build:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["robotsoul*", "adapters*"]
exclude = ["tests*", "third_party*"]

[tool.setuptools.package-data]
adapters = ["*/module.json", "*/profiles/*.json", "*/third_party/README.md"]
robotsoul = ["web/*.html", "web/*.css", "web/*.js", "data/*.json"]
